name: Daily ADU scan
on:
  schedule:
    - cron: '0 10,11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adu-board-publish
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || vars.ADU_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - id: time
        name: Check Eastern time
        run: echo "proceed=$(node scripts/is-six-am-et.mjs)" >> "$GITHUB_OUTPUT"
      - if: steps.time.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci
      - if: steps.time.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm test
          npm run test:schedule
          npm run typecheck
      - if: steps.time.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run scan -- --no-ai
      - if: steps.time.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm test
          npm run build
        env:
          ADU_SCHEDULE_ENABLED: ${{ vars.ADU_SCHEDULE_ENABLED }}
      - if: steps.time.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        name: Save validated board and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/runs/*.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record daily ADU scan"
            git push origin HEAD
          fi
